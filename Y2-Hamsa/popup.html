<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Yad2</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      width: 290px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fff;
      color: #1b1b1b;
    }
    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #eee;
    }
    h1 { margin: 0; font-size: 14px; font-weight: 600; }
    h1 span { color: #ff6600; }
    main { padding: 6px 16px 16px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .row:last-of-type { border-bottom: 0; }
    .label { font-size: 13px; line-height: 1.35; }
    .label small { display: block; font-size: 11px; color: #888; }
    .switch { position: relative; width: 42px; height: 24px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 24px;
      cursor: pointer;
      transition: background .15s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      top: 3px; inset-inline-start: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .15s;
    }
    input:checked + .slider { background: #ff6600; }
    [dir=rtl] input:checked + .slider::before { transform: translateX(-18px); }
    [dir=ltr] input:checked + .slider::before { transform: translateX(18px); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .lang { display: flex; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; flex: none; }
    .lang button {
      border: 0; background: transparent; color: inherit; cursor: pointer;
      font: 600 11px/1 "Segoe UI", Arial, sans-serif; padding: 5px 8px;
    }
    .lang button[aria-pressed=true] { background: #ff6600; color: #fff; }
    select {
      flex: none; padding: 4px 6px; border: 1px solid #ddd; border-radius: 6px;
      background: #fff; color: inherit; font: 12px "Segoe UI", Arial, sans-serif; cursor: pointer;
    }
    .stat {
      margin-top: 12px;
      padding: 10px 12px;
      background: #f6f6f6;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
    .stat b { font-size: 16px; color: #ff6600; }
    .stat small { display: block; font-size: 11px; color: #888; margin-top: 2px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #eee; }
      header { border-color: #333; }
      .row { border-color: #2c2c2c; }
      .stat { background: #2a2a2a; }
      .slider { background: #555; }
      .lang { border-color: #444; }
      select { background: #2a2a2a; border-color: #444; }
      .label small, .stat small { color: #999; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span id="brand"></span> · <b id="title" style="font-weight:600"></b></h1>
    <div class="lang" role="group" id="langGroup">
      <button type="button" data-lang="he">עב</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>
  <main>
    <div class="row">
      <span class="label"><span data-i18n="realestate"></span><small data-i18n="realestateSub"></small></span>
      <label class="switch">
        <input type="checkbox" id="hideRealestateBrokers">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="label"><span data-i18n="projects"></span><small data-i18n="projectsSub"></small></span>
      <label class="switch">
        <input type="checkbox" id="hideNewProjects">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="label"><span data-i18n="mapFull"></span><small data-i18n="mapFullSub"></small></span>
      <label class="switch">
        <input type="checkbox" id="mapFullscreen">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="label"><span data-i18n="anyShelter"></span><small data-i18n="anyShelterSub"></small></span>
      <label class="switch">
        <input type="checkbox" id="anyShelter">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="label"><span data-i18n="maxAge"></span><small data-i18n="maxAgeSub"></small></span>
      <select id="maxAgeDays">
        <option value="0" data-i18n="age0"></option>
        <option value="1" data-i18n="age1"></option>
        <option value="3" data-i18n="age3"></option>
        <option value="7" data-i18n="age7"></option>
        <option value="14" data-i18n="age14"></option>
        <option value="30" data-i18n="age30"></option>
      </select>
    </div>
    <div class="stat" id="stat"></div>
  </main>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
